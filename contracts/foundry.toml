[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["KeelVault", "KeelFactory"]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "solady/=lib/solady/src/",
]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
shannon = "${RPC_URL}"
